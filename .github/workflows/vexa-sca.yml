name: Vexa Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  vexa-scan:
    name: Run Vexa Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Vexa Security Scan
        uses: noviqtechnologies/vexa-sca@ef54c2e802a4c7df48767ee92e3450383e864998 # v1.3.5
        with:
          token: ${{ secrets.VEXA_SECURITY_API_KEY }}
          # api-url omitted: defaults to the production Vexa Cloud API
          fail-on: high
          upload-sarif: 'true'
          sast: 'true'
          secrets: 'true'
